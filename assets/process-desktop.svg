<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674.88 280.00" role="img"><title>process desktop</title><rect x="1" y="1" width="672.88" height="278.00" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="16" xml:space="preserve"><text x="20" y="36.0" fill="#39ff88">03 / PROCESS</text><text x="20" y="60.0" fill="#39ff88">$ tail -f mindset.log</text><text x="20" y="84.0" fill="#c9d1d9"></text><text x="20" y="108.0" fill="#c9d1d9">[learn] Stay curious.</text><text x="20" y="132.0" fill="#c9d1d9">[build] Turn ideas into working systems.</text><text x="20" y="156.0" fill="#c9d1d9">[secure] Question assumptions. Reduce exposure.</text><text x="20" y="180.0" fill="#c9d1d9">[ship] Improve, one commit at a time.</text><text x="20" y="204.0" fill="#c9d1d9"></text><text x="20" y="228.0" fill="#39ff88">$ git commit -m</text><text x="20" y="252.0" fill="#c9d1d9">  &quot;build what comes next&quot; ▌</text></g></svg>